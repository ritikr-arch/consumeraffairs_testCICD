name: Deploy via SFTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: LIVE_FTP   # <- yahan aapka environment name
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Upload files via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.LIVE_FTP_SERVER }}
          port: ${{ secrets.LIVE_FTP_PORT }}
          username: ${{ secrets.LIVE_FTP_USERNAME }}
          password: ${{ secrets.LIVE_FTP_PASSWORD }}
          local_path: './*'
          remote_path: '/var/www/consumerprod'
          sftp_only: true
          delete_remote_files: false
