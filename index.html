<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CI/CD Production Test</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        h1 {
            margin-bottom: 10px;
        }

        .status {
            margin-top: 20px;
            padding: 10px 20px;
            background: #00c851;
            border-radius: 20px;
            display: inline-block;
            font-weight: bold;
        }

        .time {
            margin-top: 15px;
            font-size: 14px;
            opacity: 0.8;
        } 
    </style>
</head>
<body>

    <div class="card">
        <h1>🚀 CI/CD Deployment Successful</h1>
        <p>This file confirms production deployment is working correctly.</p>

        <div class="status">
            STATUS: LIVE ON PRODUCTION
        </div>

        <div class="time" id="deployTime"></div>
    </div>

    <script>
        document.getElementById("deployTime").innerHTML =
            "Deployment Time: " + new Date().toLocaleString();
    </script>

</body>
</html>
